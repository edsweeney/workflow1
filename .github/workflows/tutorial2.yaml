name: tutorial2
on: 
  workflow_dispatch
  

jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest
    steps:
    - name: step1
      run: | 
        echo "hello from job1 step1"
        date
        pwd
        ls -al
  job2:
    name: job2 
    runs-on: ubuntu-latest
    steps:
      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: check version of python
        run: |
          pip install pandas
          python --version
          pip --version
          pandas --version
      - name: create artefact
        run: |
          touch artifact.py
          echo " #This is my artifact" > artifact.py
          python artifact.py
      
  
  job3:
    name: job3
    runs-on: ubuntu-latest
    steps:
    - name: step3
      run: |
        echo "hello from step3"
        date
  job4:
    needs: [job1, job2]
    name: job4
    runs-on: ubuntu-latest
    steps:
    - name: step4
      run: echo "i am job 4"
